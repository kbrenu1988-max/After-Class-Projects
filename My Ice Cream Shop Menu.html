<html>
    <head>
        <title>My Ice Cream Shop Menu</title>

        <style>
            body {
                background-color: #fcfe;
                text-align: center;
            }

            h1 {
                color: #fa63fc;
                font-size: 60px;
                font-family: cursive;
            }

            ul > li {
                list-style: none;
                font-size: 22px;
                font-weight: bold;
                color: darkorchid;
                border-radius: 8px;
                padding: 20px 30px;
                background-color: lavenderblush;
                margin: 7px auto;
                width: 260px;
                border: 2px solid darkorchid;
            }

            ul li:hover {
                background-color: darkorchid;
                color: lavenderblush;
            }

            ul li:nth-child(6) {
                color: rgb(253, 145, 217);
                text-decoration: none;
                font-size: 22px;
                margin: 7px auto;
                padding: 20px 30px;
                border: 2px solid rgb(253, 145, 217);
                border-radius: 8px;
            }

            ul li:nth-child(6):hover {
                background-color: rgb(253, 145, 217);
                color: lavenderblush;
            }

            .desc {
                font-size: 20;
                color: rgb(175, 120, 226);
            }

            .desc::first-letter {
                font-size: 25px;
                color: blueviolet;
            }

        </style>
    </head>

    <body>

        <h1>Ice Cream Menu</h1>
        
        <ul>
            <li>Vanilla</li>
            <li>Chocolate</li>
            <li>Strawberry</li>
            <li>Butterscotch</li>
            <li>Tender Coconut</li>
            <li>Week's Special - Blue Heaven</li>
        </ul>

        <p class="desc">Our Ice Cream are high quality. Feel safe to dig in.</p>
    </body>
</html>
